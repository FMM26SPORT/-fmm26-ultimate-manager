name: Gerar APK FMM26

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar projeto
        run: |
          echo "Projeto FMM26 encontrado"
          ls -la
